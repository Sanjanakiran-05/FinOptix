{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinOptix | Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #387ed1;
            --buy: #4caf50;
            --sell: #df514c;
            --ink: #0a0a0f;
            --ink-soft: #3d3d4a;
            --ink-muted: #8888a0;
            --surface: #ffffff;
            --surface-2: #f8f9fa;
            --border: rgba(10,10,15,0.06);
            --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #fcfcfd;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Noise Overlay */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.02;
            pointer-events: none;
            z-index: 9999;
        }

        /* ── TOP BAR ── */
        .top-bar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            height: 60px;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 10;
        }
        .top-bar .brand {
            font-family: 'Syne', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--ink);
            text-decoration: none;
            letter-spacing: -0.02em;
        }
        .top-bar .brand span { color: var(--primary); }

        /* ── AUTH WRAPPER ── */
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            position: relative;
        }

        .auth-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.03);
            animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .auth-subtitle {
            font-size: 0.875rem;
            color: var(--ink-muted);
            font-weight: 400;
        }

        /* ── ALERTS ── */
        .alert-kite {
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 24px;
            text-align: center;
            border: none;
        }
        .alert-error { background: #fff1f1; color: var(--sell); }
        .alert-success { background: #f0fdf4; color: var(--buy); }

        /* ── FORM ── */
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-soft);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-wrap i {
            position: absolute;
            left: 14px;
            color: var(--ink-muted);
            font-size: 1.1rem;
            pointer-events: none;
        }
        .form-control {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px 12px 42px;
            font-size: 14px;
            color: var(--ink);
            transition: 0.2s;
            outline: none;
        }
        .form-control:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(56, 126, 209, 0.08);
        }

        .btn-submit {
            width: 100%;
            background: var(--ink);
            color: #fff;
            border: none;
            border-radius: 100px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 126, 209, 0.2);
        }
        .btn-submit i { transition: 0.2s; }
        .btn-submit:hover i { transform: translateX(4px); }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 32px 0;
            position: relative;
        }

        .auth-footer {
            text-align: center;
            font-size: 13px;
            color: var(--ink-muted);
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="top-bar">
    <a href="{% url 'index' %}" class="brand">Fin<span>Optix</span></a>
</div>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to access your portfolio insights</p>
        </div>

        {% if data %}
            <div class="alert-kite {% if 'success' in data|lower or 'successful' in data|lower %}alert-success{% else %}alert-error{% endif %}">
                {{ data|safe }}
            </div>
        {% endif %}

        <form name="f1" method="post" action="{% url 'UserLoginAction' %}" onsubmit="return validate()">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="input-wrap">
                    <i class="bi bi-person"></i>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" autocomplete="username" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrap">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">
                Sign In <i class="bi bi-arrow-right-short"></i>
            </button>
        </form>

        <div class="divider"></div>
        
        <div class="auth-footer">
            Don't have an account? <a href="{% url 'Register' %}">Create one for free</a>
        </div>
    </div>
</div>

<script>
function validate(){
    var x = document.forms["f1"]["username"].value;
    var y = document.forms["f1"]["password"].value;
    if(x.trim() === "" || y.trim() === ""){
        alert("Please fill in all fields");
        return false;
    }
    return true;
}
</script>
</body>
</html>
